<script>
(()=>{const paths={'pre-security':'pre-security','cyber-security':'cyber-security','defensive-security':'defensive-security','offensive-security':'offensive-security'};const key=location.pathname.split('/').filter(Boolean).pop();const stageId=paths[key];const header=document.getElementById('roadmap-header'),container=document.getElementById('roadmap-nodes'),error=document.getElementById('roadmap-error');function fail(message){header.hidden=true;container.hidden=true;error.hidden=false;error.className='rm-error';error.setAttribute('role','alert');error.textContent=message}if(!stageId){fail('This roadmap address is not valid. Return to Academy home and select a learning path.');return}const stage=(window.CALION_STAGES||[]).find(s=>s.id===stageId),rooms=(window.CALION_ROOMS||[]).filter(r=>r.stageId===stageId),state=window.AcademyState;if(!stage||!rooms.length||!state){fail('The curriculum for this roadmap could not be loaded. Please refresh or return to Academy home.');return}document.title=`${stage.title} Roadmap · CALION Academy`;const canonicalUrl=`https://learning.endlessus.in/roadmap/${stageId}/`;document.getElementById('page-canonical').href=canonicalUrl;document.getElementById('page-description').content=`${stage.title}: ${rooms.length} connected cybersecurity rooms with lessons, practical exercises and saved progress in CALION Academy.`;document.getElementById('page-og-title').content=`${stage.title} Roadmap · CALION Academy`;document.getElementById('page-og-description').content=`${rooms.length} dedicated ${stage.title} rooms with lessons, practical exercises and progress tracking.`;document.getElementById('page-og-url').content=canonicalUrl;const unlocked=state.isStageUnlocked(stageId,window.CALION_ROOMS);function render(){const completed=new Set(state.getCompletedRooms());const progress=state.getStageProgress(stageId,window.CALION_ROOMS),firstIncomplete=rooms.findIndex(r=>!completed.has(r.id));const questionProgress=state.getQuestionProgress();const earnedXP=rooms.reduce((sum,r)=>sum+(completed.has(r.id)?50:0)+(r.questions||[]).reduce((n,_,i)=>n+(questionProgress[`${r.id}_q${i}`]?25:0),0),0);const maxXP=rooms.length*50+rooms.reduce((sum,r)=>sum+(r.questions||[]).length*25,0);header.innerHTML=`<span class="rm-eyebrow">Path ${String(stage.order).padStart(2,'0')} · ${stage.difficulty}</span><h1>${stage.title}</h1><p class="rm-description">${stage.description} This roadmap contains only ${rooms.length} rooms from this path.</p><div class="rm-stats"><span class="rm-stat">${progress.completed}/${rooms.length} rooms complete</span><span class="rm-stat">${progress.percentage}% path progress</span><span class="rm-stat">${earnedXP}/${maxXP} XP</span><span class="rm-stat">${stage.estimatedTime}</span><span class="rm-stat">${stage.difficulty}</span></div><div class="rm-progress" aria-label="${progress.percentage}% complete"><span style="width:${progress.percentage}%"></span></div>${unlocked?'':`<p class="rm-description" role="status"><strong>Path locked.</strong> Complete at least 3 rooms in ${stage.order===2?'Pre-Security':'Cyber Security Foundations'} to unlock this path. Return to Academy home to continue.</p>`}`;container.innerHTML=rooms.map((room,index)=>{const done=completed.has(room.id),locked=!unlocked||(!done&&index>0&&!completed.has(rooms[index-1].id)),current=!done&&!locked&&index===firstIncomplete;const cls=done?'completed':locked?'locked':current?'current':'available',status=done?'✓ Completed':locked?'🔒 Locked':current?'Current Objective':'Available',lessonCount=(room.lessons||[]).length,questionCount=(room.questions||[]).length;const action=done?'Review Room':current?'Enter Room':'Start Room';const href=`/room.html?id=${encodeURIComponent(room.id)}`;return `<article class="rm-node ${cls}" style="animation-delay:${Math.min(index*35,500)}ms"><div class="rm-card"><div class="rm-card-head"><span class="rm-number">ROOM ${String(room.roomNumber||index+1).padStart(2,'0')}</span><span class="rm-state">${status}</span></div><h2>${room.title}</h2><p>${room.description||room.whyAreYouHere||''}</p><div class="rm-meta"><span>${room.difficulty||stage.difficulty}</span><span>${room.estimatedTime||'Time varies'}</span><span>${lessonCount} lessons</span><span>${questionCount} questions</span><span>${Number(room.xpReward)||50} XP</span></div>${locked?`<p class="rm-meta" role="note">${unlocked?'Complete the previous room to unlock this room.':`Complete 3 rooms in ${stage.order===2?'Pre-Security':'Cyber Security Foundations'} to unlock this path.`}</p><span class="rm-enter" aria-disabled="true">Locked</span>`:`<a class="rm-enter" href="${href}">${action} →</a>`}</div></article>`}).join('')}render();addEventListener('calion-progress-updated',render);addEventListener('endlessus-progress-updated',render)})();
